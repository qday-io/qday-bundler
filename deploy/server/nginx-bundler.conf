# Add to qday2-nginx's conf.d. ⛔ Merge into the LIVE server config — the repo template
# in qday2-deploy lacks faucet/oracle/wiki.
#
# ⛔ The template is bind-mounted as a single read-only file. Edit it in place (`>>`, or an
# editor that keeps the inode) — `sed -i` swaps the inode and the running container keeps
# reading the old file. Then render and reload inside the container:
#   docker exec qday2-nginx sh /docker-entrypoint.d/20-envsubst-on-templates.sh
#   docker exec qday2-nginx nginx -t && docker exec qday2-nginx nginx -s reload
#
# The upstream is a variable resolved through Docker DNS at request time. A plain
# `proxy_pass http://qday-rundler:3000` is resolved at nginx start, so nginx would refuse
# to boot whenever the bundler is down — taking rpc/faucet/oracle/wiki down with it.
server {
    listen 80;
    server_name bundler.qday.info;

    client_max_body_size 1m;

    location = / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $rundler http://qday-rundler:3000;

        limit_except POST OPTIONS { deny all; }
        proxy_pass         $rundler;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
